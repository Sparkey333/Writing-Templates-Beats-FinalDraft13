<svg width="1320" height="800" viewBox="0 0 1320 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1320" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161b28"/>
      <stop offset="0.5" stop-color="#0f1320"/>
      <stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="flake" x1="250" y1="120" x2="250" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="water" x1="300" y1="300" x2="1080" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="flakeGlow" cx="250" cy="270" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sproutGlow" cx="1090" cy="560" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sprout" x1="1090" y1="470" x2="1090" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <g id="arm" stroke="url(#flake)" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="250" y1="270" x2="250" y2="130"/>
      <line x1="250" y1="188" x2="214" y2="156"/>
      <line x1="250" y1="188" x2="286" y2="156"/>
      <line x1="250" y1="228" x2="220" y2="204"/>
      <line x1="250" y1="228" x2="280" y2="204"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1320" height="800" fill="url(#bg)"/>
  <rect x="0" y="0" width="1320" height="800" fill="url(#flakeGlow)"/>
  <rect x="0" y="0" width="1320" height="800" fill="url(#sproutGlow)"/>

  <!-- faint starfield, kept to the far edges -->
  <g fill="#9fd7ff" opacity="0.5">
    <circle cx="120" cy="90" r="2.5"/><circle cx="360" cy="70" r="1.8"/><circle cx="80" cy="360" r="2"/>
    <circle cx="300" cy="470" r="1.6"/><circle cx="1180" cy="120" r="2.4"/><circle cx="1240" cy="330" r="1.8"/>
    <circle cx="1120" cy="700" r="2"/><circle cx="1260" cy="640" r="1.6"/><circle cx="60" cy="640" r="1.8"/>
  </g>

  <!-- snowflake, upper-left, out of the way of the centered icons -->
  <g>
    <use href="#arm" transform="rotate(0 250 270)"/>
    <use href="#arm" transform="rotate(60 250 270)"/>
    <use href="#arm" transform="rotate(120 250 270)"/>
    <use href="#arm" transform="rotate(180 250 270)"/>
    <use href="#arm" transform="rotate(240 250 270)"/>
    <use href="#arm" transform="rotate(300 250 270)"/>
    <circle cx="250" cy="270" r="10" fill="#ffffff"/>
  </g>

  <!-- tributaries thaw from the flake, arc along the TOP and BOTTOM edges (center kept clear
       for the app icon at ~x360 and Applications folder at ~x960 in the 660x400 window) -->
  <g fill="none" stroke="url(#water)" stroke-linecap="round" opacity="0.85">
    <path d="M250 430 C 360 560, 520 720, 760 740 C 940 754, 1030 660, 1090 590" stroke-width="7"/>
    <path d="M250 430 C 300 520, 360 150, 640 96 C 900 46, 1120 150, 1240 250" stroke-width="4" opacity="0.5"/>
    <path d="M300 360 C 520 470, 560 760, 900 770 C 1010 774, 1060 690, 1090 600" stroke-width="3.5" opacity="0.55"/>
  </g>

  <!-- the sprout, lower-right -->
  <g>
    <path d="M1090 600 C 1090 560, 1090 530, 1090 500" fill="none" stroke="url(#sprout)" stroke-width="9" stroke-linecap="round"/>
    <path d="M1090 545 C 1058 539, 1036 553, 1030 582 C 1064 586, 1085 572, 1090 545 Z" fill="url(#sprout)"/>
    <path d="M1090 532 C 1122 526, 1146 540, 1152 569 C 1116 573, 1096 559, 1090 532 Z" fill="url(#sprout)"/>
  </g>
</svg>
