<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2130"/>
      <stop offset="0.55" stop-color="#141824"/>
      <stop offset="1" stop-color="#0a0c12"/>
    </linearGradient>
    <linearGradient id="flake" x1="512" y1="150" x2="512" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#bfe9ff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="water" x1="512" y1="600" x2="512" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#2f8fbf"/>
    </linearGradient>
    <linearGradient id="sprout" x1="512" y1="740" x2="512" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="410" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sproutglow" cx="512" cy="806" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <!-- one snowflake arm pointing straight up from the center (512,410) -->
    <g id="arm" stroke="url(#flake)" stroke-width="16" stroke-linecap="round" fill="none">
      <line x1="512" y1="410" x2="512" y2="168"/>
      <line x1="512" y1="250" x2="454" y2="196"/>
      <line x1="512" y1="250" x2="570" y2="196"/>
      <line x1="512" y1="320" x2="466" y2="278"/>
      <line x1="512" y1="320" x2="558" y2="278"/>
      <line x1="512" y1="182" x2="482" y2="152"/>
      <line x1="512" y1="182" x2="542" y2="152"/>
    </g>
  </defs>

  <!-- rounded-square app background -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <ellipse cx="512" cy="806" rx="150" ry="150" fill="url(#sproutglow)"/>

  <!-- six-fold snowflake -->
  <g>
    <use href="#arm" transform="rotate(0 512 410)"/>
    <use href="#arm" transform="rotate(60 512 410)"/>
    <use href="#arm" transform="rotate(120 512 410)"/>
    <use href="#arm" transform="rotate(180 512 410)"/>
    <use href="#arm" transform="rotate(240 512 410)"/>
    <use href="#arm" transform="rotate(300 512 410)"/>
    <circle cx="512" cy="410" r="20" fill="#ffffff"/>
  </g>

  <!-- melting tributaries fanning down from the flake into the sprout -->
  <g fill="none" stroke="url(#water)" stroke-linecap="round">
    <path d="M512 560 C 500 630, 470 660, 452 726" stroke-width="12" opacity="0.9"/>
    <path d="M512 560 C 524 630, 556 660, 574 726" stroke-width="12" opacity="0.9"/>
    <path d="M512 574 C 512 650, 512 690, 512 740" stroke-width="14"/>
    <path d="M512 566 C 486 636, 430 664, 402 712" stroke-width="8" opacity="0.6"/>
    <path d="M512 566 C 538 636, 594 664, 622 712" stroke-width="8" opacity="0.6"/>
  </g>

  <!-- first green sprout of life -->
  <g>
    <path d="M512 742 C 512 790, 512 820, 512 860" fill="none" stroke="url(#sprout)" stroke-width="16" stroke-linecap="round"/>
    <path d="M512 800 C 470 792, 440 812, 430 852 C 476 856, 506 838, 512 800 Z" fill="url(#sprout)"/>
    <path d="M512 782 C 556 774, 588 792, 600 830 C 552 836, 520 818, 512 782 Z" fill="url(#sprout)"/>
  </g>
</svg>
